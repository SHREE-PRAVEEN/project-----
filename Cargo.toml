[package]
name = "project-----"
version = "0.1.0"
edition = "2024"

[dependencies]
minreq            = { version = "2.11", features = ["https-rustls-probe", "json-using-serde"] }
rand              = "0.8"
rand_chacha       = "0.3"
tiny-bip39        = "1.0"
secp256k1         = { version = "0.27", features = ["rand-std", "global-context"] }
ripemd            = "0.1"
sha2              = "0.10"
hmac              = "0.12"
bs58              = "0.4"
hex               = "0.4"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
crossbeam-channel = "0.5"
num_cpus          = "1"
flate2            = "1.0"   # for gzip decompression of Blockchair dump
 
[profile.release]
opt-level     = 3
codegen-units = 1
lto           = true
 





























